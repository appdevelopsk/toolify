name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # CI is non-deploying, but SSR and Lighthouse must use production canonical URLs.
      NEXT_PUBLIC_SITE_URL: https://toolify365.com
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: site/package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: TypeScript check
        run: npm run typecheck
      - name: i18n consistency
        run: npm run audit:i18n
      - name: SEO audit
        run: npm run audit:seo
      - name: Canonical origin regression
        run: npm run check:site-url
      - name: Unit tests
        run: npm test
      - name: Social referral HTML parser tests
        run: npm run test:smoke-html
      - name: Category discovery verifier tests
        run: node --test scripts/verify-live-category-discovery.test.mjs
      - name: Production build
        run: npm run build
      # Run Lighthouse against exactly the build verified above. Keeping the
      # server in this same job avoids duplicating 8,000+ static pages or
      # transferring the multi-GB .next tree between runners.
      - name: Start server for Lighthouse
        run: |
          npm start &
          npx wait-on http://localhost:3000 -t 60000
      # Test an indexable tool: BMI is intentionally noindex by SEO pruning policy,
      # so Lighthouse SEO scores it 0.66 despite the intended robots directive.
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14 autorun --collect.url=http://localhost:3000/en --collect.url=http://localhost:3000/en/tools/workdays-calculator --upload.target=temporary-public-storage --assert.assertions.categories:performance=0.85 --assert.assertions.categories:accessibility=0.9 --assert.assertions.categories:seo=0.9
        # Lighthouse thresholds must fail CI; do not silently mask SEO/accessibility regressions.
